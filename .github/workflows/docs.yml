# Builds the documentation site in docs/ with Quarto and publishes it to GitHub Pages
# (https://bailey-lab.github.io/SeekDeep/) on pushes to master and on v* tags. Pull requests that
# touch docs/ only build it, to catch broken pages before they reach master.
#
# The command reference (docs/reference/) is generated from a SeekDeep build by
# docs/_scripts/generate_reference.py and committed, so this workflow doesn't need to build SeekDeep.
name: docs

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:            # path filters apply to branch pushes only; tag pushes always run
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # pinned rather than ubuntu-latest so a new runner OS can't break an unchanged build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Render
        run: quarto render docs

      # the old site was over 1 GB, mostly images and data downloads; keep the published site small
      - name: Check site size
        run: |
          total_kb=$(du -sk docs/_site | cut -f1)
          echo "site size: ${total_kb} KB"
          big=$(find docs/_site -type f -size +2M)
          if [ -n "$big" ]; then
            echo "::error::files over 2 MB in the site (host large files on Zenodo or as release assets):"
            ls -lh $big
            exit 1
          fi
          if [ "$total_kb" -gt 30720 ]; then
            echo "::error::site is over 30 MB"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        with:
          path: docs/_site

  # only master and v* tags publish; a manual run from another branch just builds
  deploy:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
